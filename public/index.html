<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3d6b47" />
  <meta name="description" content="IBS-friendly food tracker with FODMAP alerts, AI recipes and cycle-synced nutrition" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Gut Guide" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Prevents zoom on input focus on iOS -->
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
  <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
  <title>Gut Guide 🌿</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; overscroll-behavior: none; }
    /* Safe area for iPhone notch/home bar */
    #root { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js');
      });
    }
  </script>
</body>
</html>
